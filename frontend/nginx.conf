server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
